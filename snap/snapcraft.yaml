# Snap of Steward for the Snap Store and Ubuntu App Center (DESIGN.md D6:
# the .deb stays the main channel). Build with `snapcraft pack` (see
# docs/snap.md). Strictly confined: like the Flatpak, the sandbox keeps
# the host's package tools out of reach, and the app says so on the
# Installed page and in Free Up Space (P9-T01, capability detection).
name: steward
title: Steward
base: core24
adopt-info: steward
summary: The file manager for Ubuntu that keeps your folders tidy
description: |
  Steward sorts a messy Downloads in one click, frees up space safely, and
  undoes anything. It shows a plan before anything moves, and one Undo puts
  everything back. Nothing is uploaded and nothing is tracked.
license: GPL-3.0-or-later
grade: stable
confinement: strict
icon: data/icons/hicolor/scalable/apps/io.github.m_umair_khan_dev.steward.svg
website: https://github.com/m-umair-khan-dev/steward
source-code: https://github.com/m-umair-khan-dev/steward
issues: https://github.com/m-umair-khan-dev/steward/issues
platforms:
  amd64:

slots:
  # Steward answers other apps ("Show in folder", the steward command,
  # Activities search) on its own bus name; the search index has its own.
  session-dbus:
    interface: dbus
    bus: session
    name: io.github.m_umair_khan_dev.steward
  indexer-dbus:
    interface: dbus
    bus: session
    name: io.github.m_umair_khan_dev.steward.Indexer

apps:
  steward:
    command: usr/bin/steward
    common-id: io.github.m_umair_khan_dev.steward
    desktop: usr/share/applications/io.github.m_umair_khan_dev.steward.desktop
    extensions: [kde-neon-6]
    plugs:
      - home                # your files
      - removable-media     # USB drives and memory cards
      - network             # a bookmark's title and picture
      - mount-observe       # drives in the sidebar, free space
      - system-observe      # About This Computer
      - hardware-observe    # About This Computer
      - upower-observe      # battery health
      - gsettings
      - unity7              # the tray icon (StatusNotifierItem)

parts:
  steward:
    plugin: nil
    source: .
    source-type: local
    build-packages:
      - curl
      - gettext
      - pkg-config
      - libglib2.0-dev
      - libsqlite3-dev
      - libssl-dev
      - build-essential
    stage-packages:
      - poppler-utils       # pdftotext, for search inside PDFs
      - libarchive-tools    # bsdtar, for Extract Here
      - shared-mime-info
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
    override-build: |
      # Rust at the version pinned in rust-toolchain.toml.
      export RUSTUP_HOME="$CRAFT_PART_BUILD/.rustup" CARGO_HOME="$CRAFT_PART_BUILD/.cargo"
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
      export PATH="$CARGO_HOME/bin:$PATH"
      # Qt 6 comes from the kde-neon-6 extension's SDK. Its tools (qmake,
      # moc, qmlcachegen) need the SDK's own Qt libraries, and cxx-qt runs
      # them with an empty environment, so LD_LIBRARY_PATH cannot reach
      # them: the build machine's linker is told about them instead. Only
      # the libraries the system lacks are linked in, so the SDKs' copies of
      # system libraries (libudev, libdrm) never shadow the real ones.
      QT_SDK=/snap/kde-qt6-core24-sdk/current
      sdk_path=""
      for sdk in kde-qt6-core24-sdk kf6-core24-sdk; do
        lib=/snap/$sdk/current/usr/lib/x86_64-linux-gnu
        sdk_path="$sdk_path:$lib:$lib/libproxy"
      done
      links=/opt/qtsdk-libs
      rm -rf "$links" /etc/ld.so.conf.d/kde-qt6-sdk.conf; mkdir -p "$links"
      ldconfig
      system_libs="$(ldconfig -p | awk '{print $1}')"
      for tool in "$QT_SDK"/usr/lib/qt6/libexec/* "$QT_SDK"/usr/bin/qt6/*; do
        [ -f "$tool" ] && LD_LIBRARY_PATH="${sdk_path#:}" ldd "$tool" 2>/dev/null || true
      done | awk '/=> \/snap\// {print $1, $3}' | sort -u | while read -r so path; do
        printf '%s\n' "$system_libs" | grep -qxF "$so" || ln -sf "$path" "$links/$so"
      done
      echo "$links" > /etc/ld.so.conf.d/kde-qt6-sdk.conf
      ldconfig
      export QMAKE="$QT_SDK/usr/bin/qmake6"
      # The Qt SDK carries dangling libglib/libgio .so links. The gold
      # linker (which cxx-qt asks for) stops at them and leaves GLib
      # unresolved; the standard linker moves on to the system's copy.
      export RUSTFLAGS="${RUSTFLAGS:-} -C link-arg=-fuse-ld=bfd"
      STEWARD_LOCALEDIR=/snap/steward/current/usr/share/locale \
        cargo build --release --locked -p steward -p steward-indexer
      install -Dm755 target/release/steward "$CRAFT_PART_INSTALL/usr/bin/steward"
      # The app starts the search index from beside itself.
      install -Dm755 target/release/steward-indexer "$CRAFT_PART_INSTALL/usr/bin/steward-indexer"
      while read -r lang; do
        [ -n "$lang" ] || continue
        install -d "$CRAFT_PART_INSTALL/usr/share/locale/$lang/LC_MESSAGES"
        msgfmt -o "$CRAFT_PART_INSTALL/usr/share/locale/$lang/LC_MESSAGES/steward.mo" "po/$lang.po"
      done < po/LINGUAS
      id=io.github.m_umair_khan_dev.steward
      install -Dm644 data/$id.desktop "$CRAFT_PART_INSTALL/usr/share/applications/$id.desktop"
      sed -i "s|^Icon=.*|Icon=\${SNAP}/usr/share/icons/hicolor/scalable/apps/$id.svg|" \
        "$CRAFT_PART_INSTALL/usr/share/applications/$id.desktop"
      install -Dm644 data/$id.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/$id.metainfo.xml"
      install -Dm644 data/$id.gschema.xml "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas/$id.gschema.xml"
      glib-compile-schemas "$CRAFT_PART_INSTALL/usr/share/glib-2.0/schemas"
      install -Dm644 data/icons/hicolor/scalable/apps/$id.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/$id.svg"
      install -Dm644 data/icons/hicolor/symbolic/apps/$id-symbolic.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/symbolic/apps/$id-symbolic.svg"
