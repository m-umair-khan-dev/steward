# Release (DESIGN.md §8.3, §9.8, P6-T12). Runs on a version tag:
#   vX.Y.Z         → apt suite "stable", .deb files attached to the release
#   vX.Y.Z-dryN    → apt suite "ci" (a dry run: nothing reaches users)
# HUMAN: enable Actions on the code host, and store the project's signing key
# as the secret APT_SIGNING_KEY (ASCII-armoured private key). The website
# deploy step is added when the website work resumes (P6-T10 is on hold).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build and test (Ubuntu ${{ matrix.ubuntu }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: true
      matrix:
        # 26.10 for now; 24.04 and 26.04 join once the project is complete (ADR 0007).
        ubuntu: ["26.10"]
    env:
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: The tag matches the version in Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"; tag="${tag%%-dry*}"
          test "$tag" = "$version" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          test -f "site/src/content/changelog/$version.md" || { echo "no release notes for $version"; exit 1; }
      - name: The gate
        run: make check
      - name: Build the .deb (lintian runs inside)
        run: make deb
      - name: Install it in a clean Ubuntu; smoke tests
        run: make deb-test
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.ubuntu }}
          path: dist/${{ matrix.ubuntu }}/*.deb
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts-${{ matrix.ubuntu }}
          path: artifacts/
          if-no-files-found: ignore

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ contains(github.ref_name, '-dry') && 'ci' || 'stable' }}
    env:
      UBUNTU_VERSION: "26.10"
      APT_SUITE: ${{ contains(github.ref_name, '-dry') && 'ci' || 'stable' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist-ci
      - name: Lay out dist/<release>/
        run: |
          for d in dist-ci/deb-*; do r="${d#dist-ci/deb-}"; mkdir -p "dist/$r"; cp "$d"/*.deb "dist/$r/"; done
          ls -R dist
      - name: Install with apt from a local copy of the repository, then upgrade
        run: make keys apt-e2e
      - name: Sign and publish to the suite
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "APT_SIGNING_KEY is not set (HUMAN)"; exit 1; }
          mkdir -p release-secrets && printf '%s\n' "$APT_SIGNING_KEY" > release-secrets/apt_signing_key.asc
          SECRETS_DIR=./release-secrets docker compose --profile publish run --rm aptrepo
          rm -rf release-secrets
          # HUMAN: upload the published tree (the aptrepo volume) to the chosen host here.
      - name: Attach the .deb files to the release
        if: ${{ !contains(github.ref_name, '-dry') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*/*.deb --title "Cairn ${GITHUB_REF_NAME#v}" \
            --notes-file "site/src/content/changelog/${GITHUB_REF_NAME#v}.md"
