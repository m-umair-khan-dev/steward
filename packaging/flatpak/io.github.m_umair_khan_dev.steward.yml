# Flatpak build of Steward (P9-T02; DESIGN.md D6). The .deb stays the main
# channel: inside the sandbox Steward cannot read the host's package lists or
# run its package tools, so the Installed page and three Smart Clean
# features explain that instead (P9-T01, capability detection).
#
# Build it with `make flatpak` (in Docker; the runtimes, about 4 GB, stay in
# a Docker volume). The bundle lands in dist/flatpak/.
# The build is offline, as on Flathub: every crate is a source listed in
# cargo-sources.json, written from Cargo.lock by cargo-sources.py (run it
# again after Cargo.lock changes). The Flathub copy of this manifest differs
# only in its source: the release tag on GitHub instead of this folder.
app-id: io.github.m_umair_khan_dev.steward
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: steward
finish-args:
  # Display and GPU.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # A file manager needs the user's files; the host's other places stay out.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  # Bookmarks fetch a link's title and picture (can be turned off).
  - --share=network
  # The Trash, mounts and drives (GVfs), the desktop's settings.
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
  - --talk-name=ca.desrt.dconf
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  # The tray icon and "Show in folder" for other apps.
  - --talk-name=org.kde.StatusNotifierWatcher
  # Qt names the tray item org.kde.StatusNotifierItem-<pid>-<n>; inside
  # the sandbox the app is pid 2.
  - --own-name=org.kde.StatusNotifierItem-2-1
  - --own-name=org.freedesktop.FileManager1
  # The search index (a child of the app) owns
  # io.github.m_umair_khan_dev.steward.Indexer, which Flatpak grants under
  # the app ID. Its own bwrap sandbox for reading files cannot start inside
  # Flatpak, so search inside files and thumbnails need another route there
  # (ADR 0015).
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    # cargo-sources.json puts the crates and a config.toml here.
    CARGO_HOME: /run/build/steward/cargo
modules:
  - name: poppler-utils
    # pdftotext, for search inside PDFs.
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_UTILS=ON
      - -DENABLE_QT5=OFF
      - -DENABLE_QT6=OFF
      - -DENABLE_GLIB=OFF
      - -DENABLE_CPP=OFF
      - -DENABLE_BOOST=OFF
      - -DENABLE_LIBOPENJPEG=none
      - -DENABLE_GPGME=OFF
      - -DENABLE_NSS3=OFF
      - -DENABLE_LCMS=OFF
      - -DENABLE_LIBCURL=OFF
      - -DBUILD_GTK_TESTS=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_QT6_TESTS=OFF
      - -DBUILD_CPP_TESTS=OFF
      - -DBUILD_MANUAL_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-25.10.0.tar.xz
        sha256: 6b5e9bb64dabb15787a14db1675291c7afaf9387438cc93a4fb7f6aec4ee6fe0
  - name: steward
    buildsystem: simple
    build-commands:
      # The SDK's Rust can trail our pinned toolchain (rust-toolchain.toml)
      # by a release; the declared minimum is ours, not a language need.
      - STEWARD_LOCALEDIR=/app/share/locale cargo build --release --offline --locked --ignore-rust-version
        -p steward -p steward-indexer
      - install -Dm755 target/release/steward /app/bin/steward
      # The app starts the indexer from beside itself.
      - install -Dm755 target/release/steward-indexer /app/bin/steward-indexer
      - for po in po/*.po; do lang=$(basename "$po" .po); [ "$lang" = "en@pseudo" ] && continue;
        install -d /app/share/locale/$lang/LC_MESSAGES;
        msgfmt -o /app/share/locale/$lang/LC_MESSAGES/steward.mo "$po"; done
      - install -Dm644 data/io.github.m_umair_khan_dev.steward.desktop /app/share/applications/io.github.m_umair_khan_dev.steward.desktop
      - install -Dm644 data/io.github.m_umair_khan_dev.steward.metainfo.xml /app/share/metainfo/io.github.m_umair_khan_dev.steward.metainfo.xml
      - install -Dm644 data/io.github.m_umair_khan_dev.steward.gschema.xml /app/share/glib-2.0/schemas/io.github.m_umair_khan_dev.steward.gschema.xml
      - glib-compile-schemas /app/share/glib-2.0/schemas
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.m_umair_khan_dev.steward.svg /app/share/icons/hicolor/scalable/apps/io.github.m_umair_khan_dev.steward.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/io.github.m_umair_khan_dev.steward-symbolic.svg /app/share/icons/hicolor/symbolic/apps/io.github.m_umair_khan_dev.steward-symbolic.svg
      - install -Dm644 data/io.github.m_umair_khan_dev.steward.search-provider.ini /app/share/gnome-shell/search-providers/io.github.m_umair_khan_dev.steward.search-provider.ini
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - dist
          - artifacts
          - secrets
          - fileosmac
          - site/node_modules
          - spikes
          - .env
      - cargo-sources.json
