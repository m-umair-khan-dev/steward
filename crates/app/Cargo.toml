[package]
name = "steward"
description = "file manager for Ubuntu that keeps folders tidy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[[bin]]
name = "steward"
path = "src/main.rs"

[features]
# Compiles in the io.github.m_umair_khan_dev.steward.Test1 D-Bus interface used by end-to-end
# tests (DESIGN.md §10.2). Never enabled in release packages.
e2e = []

[dependencies]
steward-core.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
gettext-rs.workspace = true
gio.workspace = true
glib.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[lints]
workspace = true

# The .deb (P6-T08, DESIGN.md §8.8). Built by packaging/build-deb, which first
# stages the translations and the changelog under target/package/.
[package.metadata.deb]
name = "steward"
maintainer = "Steward contributors <maintainers@example.invalid>"   # HUMAN: real address
copyright = "2026 Steward contributors"
section = "utils"
# The package was called cairn before the rename (2026-11-23).
conflicts = "cairn"
replaces = "cairn"
provides = "cairn"
priority = "optional"
extended-description = """\
Steward is a file manager for Ubuntu that keeps folders tidy. It shows a plan
before anything moves, and one Undo puts everything back. It adds folder
sizes, search as you type, two panes, workspaces, Free Up Space, a list of
everything installed, and About This Computer."""
# Qt's QML modules and plugins are loaded at run time, so dpkg-shlibdeps
# cannot see them: they are listed here.
depends = """$auto, qml6-module-qtquick, qml6-module-qtquick-window, qml6-module-qtquick-controls, \
qml6-module-qtquick-templates, qml6-module-qtquick-layouts, qml6-module-qtquick-effects, \
qml6-module-qtquick-shapes, qml6-module-qtqml-workerscript, qml6-module-qtquick-dialogs, \
qml6-module-qtquick-pdf, qml6-module-qtmultimedia, qml6-module-qtcore, qt6-wayland, qt6-svg-plugins, \
shared-mime-info, bubblewrap, python3, libarchive-tools, dbus-user-session | dbus-x11"""
recommends = "gvfs, xdg-user-dirs, poppler-utils"
suggests = "nautilus"
changelog = "../../target/package/changelog"
assets = [
    ["target/release/steward", "usr/bin/", "755"],
    ["target/release/steward-indexer", "usr/libexec/", "755"],
    ["../../data/io.github.m_umair_khan_dev.steward.desktop", "usr/share/applications/", "644"],
    ["../../data/io.github.m_umair_khan_dev.steward.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../../data/io.github.m_umair_khan_dev.steward.gschema.xml", "usr/share/glib-2.0/schemas/", "644"],
    ["../../data/icons/hicolor/scalable/apps/io.github.m_umair_khan_dev.steward.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../data/icons/hicolor/symbolic/apps/io.github.m_umair_khan_dev.steward-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["../../data/steward-indexer.service", "usr/lib/systemd/user/", "644"],
    ["../../data/io.github.m_umair_khan_dev.steward.Indexer.service", "usr/share/dbus-1/services/", "644"],
    ["../../data/io.github.m_umair_khan_dev.steward.service", "usr/share/dbus-1/services/", "644"],
    ["../../data/io.github.m_umair_khan_dev.steward.search-provider.ini", "usr/share/gnome-shell/search-providers/", "644"],
    ["../../browser-extension/host/steward-native-host", "usr/libexec/", "755"],
    ["../../browser-extension/host/io.github.m_umair_khan_dev.steward.firefox.json", "usr/lib/mozilla/native-messaging-hosts/io.github.m_umair_khan_dev.steward.json", "644"],
    ["../../target/package/locale/**/*.mo", "usr/share/locale/", "644"],
    ["../../target/package/steward.1.gz", "usr/share/man/man1/", "644"],
    ["../../packaging/debian/copyright", "usr/share/doc/steward/", "644"],
]

# Ubuntu 24.04 (GNOME 46, Qt 6.4): no qml6-module-qtquick-effects (the app falls
# back without blur and shadows) and the SVG plugin is in libqt6svg6.
# packaging/build-deb picks this variant on 24.04.
[package.metadata.deb.variants.ubuntu2404]
name = "steward"   # a variant would otherwise be named steward-ubuntu2404
depends = """$auto, qml6-module-qtquick, qml6-module-qtquick-window, qml6-module-qtquick-controls, \
qml6-module-qtquick-templates, qml6-module-qtquick-layouts, \
qml6-module-qtquick-shapes, qml6-module-qtqml-workerscript, qml6-module-qtquick-dialogs, \
qml6-module-qtquick-pdf, qml6-module-qtmultimedia, qml6-module-qtcore, qt6-wayland, libqt6svg6, \
shared-mime-info, bubblewrap, python3, libarchive-tools, dbus-user-session | dbus-x11"""
