[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/indexer", "crates/cli"]
# Throwaway proofs build on their own (see spikes/*/README.md).
exclude = ["spikes"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/m-umair-khan-dev/steward"
authors = ["Steward contributors"]

[workspace.dependencies]
steward-core = { path = "crates/core" }
# Front end: Qt 6 / QML through cxx-qt (ADR 0009).
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
glib = "0.22"
gio = "0.22"
rusqlite = { version = "0.41", features = ["bundled"] }
# Safe syscalls the standard library lacks: renameat2(RENAME_NOREPLACE), getuid.
rustix = { version = "1", features = ["fs", "process", "system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Git branch and changes for the path bar (P7-T01), read-only.
gix = { version = "0.90", default-features = false, features = ["status", "sha1"] }
# Duplicate finder: full-content hashes (DESIGN.md §7.1).
blake3 = "1"
# Bookmarks (P7-T08): a link's title and picture, the app's only outbound
# request, and only when Preferences allow it. rustls, no system OpenSSL.
ureq = "3"
# Search inside files (P7-T09): OpenDocument and Office files are zipped XML.
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
# Denied, not forbidden: the cxx-qt bridge module needs `unsafe extern "C++"` (ADR 0009).
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.dev]
# Smaller debug info keeps memory use and target size down in the Docker VM.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# SQLite is C code: optimise it even in dev builds, so index tests and the
# E3-10 timing measure a real build.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
