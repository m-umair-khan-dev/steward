[pytest]
# End-to-end tests (DESIGN.md §10.2). Run with `make e2e`.
addopts = -ra -p no:cacheprovider
testpaths = .
markers =
    p0: Phase 0 scenarios
    p1: Phase 1 scenarios
    p2: Phase 2 scenarios
    p3: Phase 3 scenarios
    p4: Phase 4 scenarios
    p5: Phase 5 scenarios
    p6: Phase 6 scenarios
    p7: Phase 7 scenarios
    p8: Phase 8 scenarios
    p9: Phase 9 scenarios
    smoke: also run against the installed .deb
    shots: produces screenshots for the website
    manual: needs a human or real hardware; not run by default
